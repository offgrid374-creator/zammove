.hbg{position:absolute;inset:0;overflow:hidden;border-radius:30px}.hbg svg{position:absolute;right:0;top:0;width:78%;height:100%}

.pg{--bg:#F5F7FA;--sf:#fff;--wash:#E9EDF3;--ink:#111827;--ink2:#4B5565;--mu:#5B6472;--ln:#DDE2EA;--ac:#C2410C;--ac-h:#9A3412;--ok:#1F6B3A;--er:#B42318;

.p-c{max-width:1160px;margin:auto;padding:0 24px}

 const acts=au?`<a class="p-b p-pri" data-a="nav" data-v="book" href="#">Book a haul</a><a class="z-link" data-a="nav" data-v="bookings" href="#">My bookings</a>`:`<a class="p-b p-pri" data-a="swap" data-m="up" href="#">Create account</a><a class="z-link" data-a="scr" data-t="pay">How payment works</a>`;
 const lead=au?`Welcome back, ${f}. Pick a vehicle, see the price first, and pay half after a driver accepts and half after delivery.`:'Pick a vehicle, see the price first, and pay half after a driver accepts and half after delivery.';
 return `<div class="p-c"><section class="z-hero"><div class="z-copy"><h1>Book a van or truck in Zamboanga City</h1><p>${lead}</p><div class="z-acts">${acts}</div><div class="scene" id="scene" role="img" aria-label="Illustration of the selected vehicle">${sceneH()}</div></div>
<div class="ticket" id="psc"><div class="t-head"><span>WAYBILL</span><span class="n">${ZREF}</span></div><div class="p-tabs" role="tablist">${psTabs()}</div><div class="p-sb" id="ps-b">${psBody()}</div></div></section></div>
${au?tripsH():''}
<section class="sec2 p-c" id="rates"><h2 style="max-width:16em">Pick the vehicle that fits your load</h2><div class="z-fleet">${HV.map(v=>fl(v.id,v.n,v.cap,'From '+m0(v.base)+' · '+m0(v.km)+'/km','v')).join('')}</div><h3 class="p-sub">Self-drive rental</h3><div class="z-fleet t3" style="margin-top:24px">${RV.map(v=>fl(v.id,v.n,v.sp,m0(v.day)+'/day · '+m0(DEP)+' deposit','rv')).join('')}</div></section>
<section class="sec2 band-t" id="pay"><div class="p-c z-pay"><div><h2>Pay in two halves</h2><p>Nothing is charged when you book. Half is due after a driver accepts and the rest after delivery. GCash, cash or both. Move through the stages to see when each half is due.</p></div><div id="payd">${payH()}</div></div></section>
<section class="sec2 p-c" id="how"><div class="p-sp"><h2>From request to delivery in four steps</h2><ol class="p-ol">${[['Request a haul','Choose pickup, drop-off, vehicle and time. You get an itemized estimate.'],['Driver accepts','Pay 50% down by GCash, cash or both.'],['Follow the trip','Status updates from pickup, loading and transit to arrival.'],['Confirm delivery','Pay the balance, then rate your driver.']].map((s,i)=>`<li><span class="k">${i+1}</span><div><b>${s[0]}</b><span>${s[1]}</span></div></li>`).join('')}</ol></div></section>
<section class="sec2 p-c" id="faq"><div style="max-width:820px"><h2 style="margin-bottom:28px">Questions before you book</h2><div class="p-q">${FQ.map(q=>`<details><summary>${q[0]}<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></summary><p>${q[1]}</p></details>`).join('')}</div></div></section>
${au?'':`<section class="sec2 band-k"><div class="p-c z-own"><div><h2>Ready to move something?</h2><p style="margin-top:12px">Create an account to book your first haul.</p></div><a class="p-b p-pri" data-a="swap" data-m="up" href="#">Create account</a></div></section>`}`};
landing=()=>homeBody(false);
home=function(){return vbox()+`<div class="pg pgi">${homeBody(true)}<footer class="p-c p-ft"><span>ZamMove, Zamboanga City, Philippines</span><span>Prototype: accounts and bookings stay in this browser.</span></footer></div>`};
render();
