<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZamMove Admin Panel</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14212b;--mu:#5d6b77;--bd:#dde3e8;--ac:#0b6e6e;--ac2:#e3f2f2;--bad:#b3261e;--ok:#1b7a3d;--warn:#8a5a00;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#10171c;--card:#18222a;--ink:#e8eef2;--mu:#9aa9b5;--bd:#2b3945;--ac:#47b8b8;--ac2:#163131;--bad:#ff8a80;--ok:#6fd18f;--warn:#f0c36a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1{font-size:22px;margin:0 0 12px}h2{font-size:16px;margin:18px 0 8px}.mu{color:var(--mu);font-size:13px}
.lay{display:flex;min-height:100vh}.side{width:220px;background:var(--card);border-right:1px solid var(--bd);padding:14px 10px;flex:none}
.side b.brand{display:block;font-size:18px;padding:4px 10px 12px;color:var(--ac)}
.side button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:9px 10px;border-radius:8px;font:inherit;cursor:pointer}
.side button.on{background:var(--ac2);color:var(--ac);font-weight:600}.main{flex:1;min-width:0;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.tile span{display:block;color:var(--mu);font-size:12px}.tile b{font-size:22px}
button.b,a.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}
button.b.o{background:none;color:var(--ac);border:1px solid var(--ac)}button.b.d{background:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}.row input,.row select{flex:1;min-width:130px}
.zw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;font-size:13.5px;vertical-align:top}
.tg{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--ac2);color:var(--ac)}.tg.bad{background:#f9dedc;color:var(--bad)}.tg.ok{background:#dcf2e3;color:var(--ok)}.tg.w{background:#fbefd2;color:var(--warn)}
.fl{padding:9px 12px;border-radius:8px;margin-bottom:12px;background:var(--ac2)}.fl.e{background:#f9dedc;color:var(--bad)}
.login{max-width:380px;margin:12vh auto;padding:0 16px}.login input{width:100%;margin:4px 0 10px}
#mod{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}#mod[hidden]{display:none}#mod img{max-width:100%;max-height:85vh;border-radius:8px;background:#fff}
@media(max-width:760px){.lay{display:block}.side{width:auto;display:flex;overflow-x:auto;gap:4px;padding:8px;border-right:0;border-bottom:1px solid var(--bd)}.side b.brand{display:none}.side button{width:auto;white-space:nowrap}.main{padding:12px}}
</style></head><body>
<div id="app"></div><div id="mod" hidden data-a="close"></div>
<script>
'use strict';
const KEY='hg',SK='zm_admin_me',LK='zm_admin_lock';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={},me=sessionStorage.getItem(SK),page='dash',flash=null;
const load=()=>{try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){S={}}['users','apps','vh','asg','bk','pay','rem','inc','au'].forEach(k=>S[k]=S[k]||[]);S.cfg=S.cfg||{coShare:80};S.dp=S.dp||{}};
const save=()=>{let c={};try{c=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}localStorage.setItem(KEY,JSON.stringify(Object.assign(c,S)))};
const U=em=>S.users.find(u=>u.em==em),nm=em=>(U(em)||{}).name||em||'—',cu=()=>me&&U(me),lv=()=>(cu()||{}).adm||'',isC=()=>!!(cu()||{}).cash,full=()=>['super','admin'].includes(lv());
const peso=n=>'₱'+(+n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}),ts=t=>String(t||'').slice(0,16).replace('T',' ');
const ok=m=>({ok:true,msg:m}),no=e=>({ok:false,err:e}),au=(evt,data)=>S.au.push({t:new Date().toISOString(),who:me,evt,data}),NOW=()=>new Date().toISOString();
const PAGES=[['dash','Overview','a'],['apps','Applications','f'],['veh','Vehicles','f'],['asg','Assignments','f'],['bk','Bookings','s'],['inc','Incidents','s'],['rem','Remittances','c'],['pay','Payments ledger','c'],['sum','Settlements','c'],['set','Settings','f'],['staff','Staff','S'],['log','Audit log','f']];
const allow=p=>{const g=p[2],l=lv();return g=='a'?!!(l||isC()):g=='f'?full():g=='s'?!!l:g=='c'?(full()||isC()):g=='S'?l=='super':false};
const asgOf=em=>S.asg.find(a=>a.st=='Active'&&a.driver==em),vOf=id=>S.vh.find(v=>v.id==id);
const half=b=>Math.round(Math.round(b.tot*100)/2),gross=b=>S.pay.filter(p=>p.bid==b.id&&p.by).reduce((s,p)=>s+p.amount,0),rate=()=>+S.cfg.coShare||0,due=g=>Math.round(g*rate()/100);
const tag=s=>`<span class="tg ${/Approved|Verified|Resolved|Completed|Active|Closed/.test(s)?'ok':/Reject|Discrepancy|Cancel/.test(s)?'bad':/Pending|Submitted|Awaiting|Under|Open/.test(s)?'w':''}">${esc(s)}</span>`;
const tbl=(h,r)=>r.length?`<div class="zw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`:'<p class="mu">Nothing here yet.</p>';
const btn=(a,l,at='',c='')=>`<button class="b ${c}" data-a="${a}" ${at}>${l}</button>`,inp=(id,x,ph,t='text')=>`<input id="i-${id}-${x}" type="${t}" placeholder="${ph}">`,val=(id,x)=>(document.getElementById('i-'+id+'-'+x)||{}).value||'';
const tile=(l,v)=>`<div class="tile"><span>${l}</span><b>${v}</b></div>`;

/* ---------- actions (same rules as the main app) ---------- */
const A={};
A.app=(id,act,d)=>{if(!full())return no('Administrator access required.');const p=S.apps.find(x=>x.id==id);if(!p)return no('Application not found.');const s=p.st;p.hist=p.hist||[];const go=n=>{p.st=n;p.hist.push({st:n,t:NOW(),by:me,note:d.note||d.reason||''})};
 if(['Approved','Rejected'].includes(s))return no('This application is already closed.');
 if(act=='verify'){if(s!='Pending Review')return no('Only new applications can start verification.');go('Under Verification')}
 else if(act=='interview'){if(!['Under Verification','Awaiting Additional Documents'].includes(s))return no('Verify the documents before scheduling an interview.');if(!d.when||!d.where.trim())return no('Enter the interview date/time and place.');p.iv={when:d.when,where:d.where};go('Interview Scheduled')}
 else if(act=='request'){if(!['Under Verification','Interview Scheduled'].includes(s))return no('Nothing to request at this stage.');if(d.note.trim().length<5)return no('Describe what is needed.');p.req=d.note;go('Awaiting Additional Documents')}
 else if(act=='orient'){if(s!='Interview Scheduled')return no('Schedule and hold the interview first.');go('For Orientation')}
 else if(act=='orientdone'){if(s!='For Orientation')return no('The applicant is not at the orientation stage.');p.orient=true;p.hist.push({st:'Orientation completed',t:NOW(),by:me})}
 else if(act=='approve'){if(s!='For Orientation'||!p.orient)return no('Approval requires a completed orientation.');const u=U(p.user),r=u&&(u.roles||[]).find(x=>x.t==p.role);if(!r)return no('Applicant role record is missing.');go('Approved');r.st='approved';r.by=me;r.at=NOW()}
 else if(act=='reject'){if(d.reason.trim().length<5)return no('Write the reason.');go('Rejected');const u=U(p.user),r=u&&(u.roles||[]).find(x=>x.t==p.role);if(r)r.st='rejected'}
 else return no('Unknown action.');au('application '+act,{app:id,role:p.role,user:p.user});return ok('Application updated.')};
A.veh=(id,act,reason)=>{if(!full())return no('Administrator access required.');const v=vOf(id);if(!v||v.approval!='Pending Approval')return no('Vehicle not found or already decided.');
 if(act=='approve'){v.approval='Approved';v.status='Available'}else{if((reason||'').trim().length<5)return no('Write the reason.');v.approval='Rejected'}(v.hist=v.hist||[]).push({e:v.approval,t:NOW(),by:me,note:reason||''});au('vehicle '+act,{vehicle:id});return ok('Vehicle '+v.approval.toLowerCase()+'.')};
A.asg=(id,act,reason)=>{if(!full())return no('Administrator access required.');const q=S.asg.find(x=>x.id==id);if(!q||q.st!='Pending Admin Review')return no('Request not found or already decided.');q.hist=q.hist||[];
 if(act=='reject'){if((reason||'').trim().length<5)return no('Write the reason.');q.st='Rejected';q.hist.push({st:'Rejected',t:NOW(),by:me,note:reason});au('assignment rejected',{id});return ok('Assignment rejected.')}
 const dr=U(q.driver),v=vOf(q.vehicle),dRole=dr&&(dr.roles||[]).find(r=>r.t=='driver');if(!dRole||dRole.st!='approved')return no('The driver is not approved. Their application must be approved first.');if(!v||v.approval!='Approved')return no('The vehicle is not approved.');
 S.asg.forEach(x=>{if(x.st=='Active'&&(x.vehicle==v.id||x.driver==dr.em)){x.st='Ended';(x.hist=x.hist||[]).push({st:'Ended',t:NOW(),by:me,note:'Replaced by '+q.id})}});q.st='Active';q.hist.push({st:'Active',t:NOW(),by:me});S.dp[dr.em]=Object.assign({},S.dp[dr.em],{avail:'Unavailable'});au('assignment approved',{id,vehicle:v.id,driver:dr.em});return ok('Assignment approved.')};
A.verify=(id,recv,note)=>{if(!(full()||isC()))return no('Only a cashier or administrator can verify remittances.');const r=S.rem.find(x=>x.id==id);if(!r||!['Submitted','Discrepancy'].includes(r.st))return no('Remittance not available for verification.');if(r.drv==me)return no('You cannot verify your own remittance.');const c=Math.round(+recv*100);if(!(c>=0)||recv==='')return no('Enter the amount received.');
 Object.assign(r,{recv:c/100,diff:Math.round(c-r.due*100)/100,by:me,vt:NOW(),note:note||''});r.st=r.diff===0?'Verified':'Discrepancy';au('remittance '+r.st,{id,due:r.due,recv:r.recv});return ok('Remittance '+r.st.toLowerCase()+'.')};
A.resolve=(id,note,adj)=>{if(!(full()||isC()))return no('Only a cashier or administrator can resolve discrepancies.');const r=S.rem.find(x=>x.id==id);if(!r||r.st!='Discrepancy')return no('No open discrepancy.');if((note||'').trim().length<5)return no('Write how the discrepancy was resolved.');
 const a=Math.round((+adj||0)*100)/100;if(a<0)return no('Adjustment cannot be negative.');r.recv=Math.round((r.recv+a)*100)/100;r.diff=Math.round((r.recv-r.due)*100)/100;if(r.diff<0&&!full())return no('A shortfall of '+peso(-r.diff)+' remains. Record the missing payment, or ask an administrator to resolve it.');
 r.st='Resolved';r.rnote=note.trim();r.rby=me;if(a)r.adj=(r.adj||0)+a;au('discrepancy resolved',{id,adj:a,shortfall:Math.min(0,r.diff)});return ok('Discrepancy resolved.')};
const ICT={start:['Submitted'],evidence:['Under review','Statement recorded'],statement:['Under review','Evidence requested'],decide:['Under review','Evidence requested','Statement recorded'],close:['Decision recorded']},ICTo={start:'Under review',evidence:'Evidence requested',statement:'Statement recorded',decide:'Decision recorded',close:'Closed'},ICL={start:'Start review',evidence:'Request evidence',statement:'Record statement',decide:'Record decision',close:'Close case'};
A.inc=(id,act,note)=>{if(!full())return no('Only an administrator can investigate incidents.');const c=S.inc.find(x=>x.id==id);if(!c)return no('Case not found.');if(c.st=='Closed')return no('This case is closed.');note=(note||'').trim();
 if(act=='note'){if(!note)return no('Write a note first.')}else{if(!ICT[act]||!ICT[act].includes(c.st))return no('That step is not allowed while the case is "'+c.st+'".');if(act!='start'&&!note)return no('A note is required for this step.');if(act=='decide')c.decision=note;c.st=ICTo[act]}
 (c.log=c.log||[]).push({t:NOW(),by:me,act,note});au('incident '+act,{id});return ok('Case updated.')};
A.staff=(em,role)=>{if(lv()!='super')return no('Only the owner admin can manage staff.');const u=U((em||'').trim().toLowerCase());if(!u)return no('No registered account has that email. They must register first.');if(role=='cash'?u.cash:u.adm)return no('That account already has this role.');if(role=='cash')u.cash=true;else u.adm=role;au('staff appointed',{user:u.em,role});return ok('Appointed '+u.em+'.')};
A.unstaff=(em,k)=>{if(lv()!='super')return no('Only the owner admin can manage staff.');const u=U(em);if(!u||u.adm=='super')return no('That account cannot be changed.');if(k=='cash')delete u.cash;else delete u.adm;au('staff revoked',{user:em,role:k});return ok('Access revoked.')};
A.cfg=r=>{if(!full())return no('Only an administrator can change settings.');r=Math.round(+r);if(!(r>=1&&r<=100))return no('Enter a whole number from 1 to 100.');au('remittance rate',{from:S.cfg.coShare,to:r});S.cfg.coShare=r;return ok('Rate saved.')};

/* ---------- pages ---------- */
const docBtns=(kind,id,docs,photo)=>(docs||[]).map((d,j)=>btn('doc','View '+esc(d.name),`data-k="${kind}" data-id="${id}" data-j="${j}"`,'o')).join(' ')+(photo?' '+btn('doc','Vehicle photo',`data-k="vph" data-id="${id}"`,'o'):'');
const P={};
P.dash=()=>`<h1>Overview</h1><div class="tiles">${tile('Applications to review',S.apps.filter(a=>!['Approved','Rejected'].includes(a.st)).length)}${tile('Vehicles to approve',S.vh.filter(v=>v.approval=='Pending Approval').length)}${tile('Assignments to approve',S.asg.filter(a=>a.st=='Pending Admin Review').length)}${tile('Bookings',S.bk.length)}${tile('Active trips',S.bk.filter(b=>b.drvUser&&!['Completed','Cancelled','Rejected'].includes(b.st)).length)}${tile('Open incidents',S.inc.filter(c=>c.st!='Closed').length)}${tile('Remittances to verify',S.rem.filter(r=>['Submitted','Discrepancy'].includes(r.st)).length)}${tile('Users',S.users.length)}</div><p class="mu">Everything here is read live from the shared ZamMove data in this browser.</p>`;
P.apps=()=>{const l=S.apps.slice().reverse();return `<h1>Applications</h1>${l.length?l.map(a=>{const u=U(a.user)||{},i=a.info||{},s=a.st,closed=['Approved','Rejected'].includes(s),id=a.id,I=inp.bind(null,id);
 return `<div class="card"><b>${esc(nm(a.user))}</b> · ${esc(a.role)} ${tag(s)}<div class="mu">${esc(a.user)} · ${esc(u.ph||'')} · ${esc(u.ad||'')}${i.license?' · licence '+esc(i.license):''}</div><div class="row">${docBtns('app',id,a.docs)}</div>${a.iv?`<p class="mu">Interview: ${esc(a.iv.when)} at ${esc(a.iv.where)}</p>`:''}${a.req&&s=='Awaiting Additional Documents'?`<p class="mu">Requested from applicant: ${esc(a.req)}</p>`:''}
 ${closed?'':`<div class="row">${s=='Pending Review'?btn('app','Start verification',`data-id="${id}" data-x="verify"`):''}${['Under Verification','Awaiting Additional Documents'].includes(s)?`<input id="i-${id}-w" type="datetime-local">${I('p','Interview place')}${btn('app','Schedule interview',`data-id="${id}" data-x="interview"`)}`:''}${['Under Verification','Interview Scheduled'].includes(s)?`${I('n','What is needed from the applicant')}${btn('app','Request document',`data-id="${id}" data-x="request"`,'o')}`:''}${s=='Interview Scheduled'?btn('app','Interview held: to orientation',`data-id="${id}" data-x="orient"`):''}${s=='For Orientation'&&!a.orient?btn('app','Mark orientation completed',`data-id="${id}" data-x="orientdone"`):''}${s=='For Orientation'&&a.orient?btn('app','Approve role',`data-id="${id}" data-x="approve"`):''}</div><div class="row">${I('r','Reason for rejection')}${btn('app','Reject',`data-id="${id}" data-x="reject"`,'d')}</div>`}</div>`}).join(''):'<p class="mu">No applications.</p>'}`};
P.veh=()=>{const pend=S.vh.filter(v=>v.approval=='Pending Approval');return `<h1>Vehicles</h1><h2>Waiting for approval</h2>${pend.length?pend.map(v=>`<div class="card"><b>${esc(v.brand)} ${esc(v.model)}</b> · ${esc(v.plate)} ${tag(v.approval)}<div class="mu">Owner ${esc(nm(v.owner))} · registration expires ${esc(v.regExp||'—')}</div><div class="row">${docBtns('veh',v.id,v.docs,v.photo)}</div><div class="row">${btn('veh','Approve',`data-id="${v.id}" data-x="approve"`)}${inp(v.id,'r','Reason for rejection')}${btn('veh','Reject',`data-id="${v.id}" data-x="reject"`,'d')}</div></div>`).join(''):'<p class="mu">No vehicles waiting.</p>'}<h2>All vehicles</h2>${tbl(['Vehicle','Plate','Owner','Approval','Status'],S.vh.map(v=>[esc(v.brand+' '+v.model),esc(v.plate),esc(nm(v.owner)),tag(v.approval),esc(v.status)]))}`};
P.asg=()=>{const pend=S.asg.filter(a=>a.st=='Pending Admin Review');return `<h1>Driver assignments</h1><h2>Waiting for approval</h2>${pend.length?pend.map(a=>{const v=vOf(a.vehicle)||{};return `<div class="card"><b>${esc(nm(a.driver))}</b> → ${esc(v.brand||'')} ${esc(v.model||'')} (${esc(v.plate||'')})<div class="mu">${esc(a.mode||'')} · requested by ${esc(nm(a.by))}${a.note?' · '+esc(a.note):''}</div><div class="row">${btn('asg','Approve',`data-id="${a.id}" data-x="approve"`)}${inp(a.id,'r','Reason for rejection')}${btn('asg','Reject',`data-id="${a.id}" data-x="reject"`,'d')}</div></div>`}).join(''):'<p class="mu">No requests waiting.</p>'}<h2>History</h2>${tbl(['Driver','Vehicle','Mode','Status'],S.asg.slice().reverse().map(a=>[esc(nm(a.driver)),esc((vOf(a.vehicle)||{}).plate||a.vehicle),esc(a.mode||''),tag(a.st)]))}`};
P.bk=()=>`<h1>Bookings</h1>${tbl(['Booking','Route','Customer','Driver','Status','Fare','Timeline'],S.bk.slice().reverse().map(b=>[esc(b.id),esc((b.pu||'')+' → '+(b.dr||'')),esc(b.cu?nm(b.cu):'—'),esc(b.drvUser?nm(b.drvUser):'—'),tag(b.st),peso(b.tot),`<details><summary>${(b.ev||[]).length} events</summary>${(b.ev||[]).map(e=>`<div class="mu">${ts(e.t)} ${esc(e.to)}${e.note?': '+esc(e.note):''}</div>`).join('')}</details>`]))}`;
P.inc=()=>`<h1>Incident cases</h1><p class="mu">Reports are reviewed before any decision. Nobody is blamed or penalized from an initial report alone.</p>${S.inc.length?S.inc.slice().reverse().map(c=>`<div class="card"><b>${esc(c.id)}</b> · booking ${esc(c.bid||'—')} · ${esc(c.cat||'')} · severity ${esc(c.sev||'')} ${tag(c.st)}<p>${esc(c.w||'')}</p>${(c.log||[]).map(l=>`<div class="mu">${ts(l.t)} ${esc(l.act)} by ${esc(nm(l.by))}${l.note?': '+esc(l.note):''}</div>`).join('')}${c.decision?`<p><b>Decision:</b> ${esc(c.decision)}</p>`:''}${full()&&c.st!='Closed'?`<textarea id="i-${c.id}-n" rows="2" style="width:100%;margin-top:8px" placeholder="Note, evidence request or finding"></textarea><div class="row">${btn('inc','Add note',`data-id="${c.id}" data-x="note"`,'o')}${Object.keys(ICT).filter(k=>ICT[k].includes(c.st)).map(k=>btn('inc',ICL[k],`data-id="${c.id}" data-x="${k}"`)).join('')}</div>`:''}</div>`).join(''):'<p class="mu">No incident reports.</p>'}`;
P.rem=()=>{const q=S.rem.filter(r=>r.st=='Submitted'),d=S.rem.filter(r=>r.st=='Discrepancy'),row=(r,res)=>[esc(nm(r.drv)),esc(r.week),peso(r.due),esc(r.method)+' · '+esc(r.ref)+(r.diff?`<br>Received ${peso(r.recv)} (${r.diff>0?'+':'-'}${peso(Math.abs(r.diff))})`:''),res?`<div class="row">${inp(r.id,'a','Extra payment received','number')}${inp(r.id,'n','Resolution note')}${btn('res','Resolve',`data-id="${r.id}"`)}</div>`:`<div class="row">${inp(r.id,'a','Amount received','number')}${inp(r.id,'n','Note (optional)')}${btn('ver','Verify',`data-id="${r.id}"`)}</div>`];
 return `<h1>Weekly remittances</h1><div class="tiles">${tile('Awaiting verification',q.length)}${tile('Discrepancies',d.length)}${tile('Verified',S.rem.filter(r=>['Verified','Resolved'].includes(r.st)).length)}</div><h2>Awaiting verification</h2>${tbl(['Driver','Week','Expected','Driver reported','Action'],q.map(r=>row(r,0)))}<h2>Discrepancies</h2>${tbl(['Driver','Week','Expected','Details','Action'],d.map(r=>row(r,1)))}<h2>History</h2>${tbl(['Driver','Week','Due','Received','Status'],S.rem.filter(r=>['Verified','Resolved'].includes(r.st)).map(r=>[esc(nm(r.drv)),esc(r.week),peso(r.due),peso(r.recv),tag(r.st)]))}`};
P.pay=()=>`<h1>Payment ledger</h1><p class="mu">Customer collections recorded by drivers. Kept separate from driver earnings, owner compensation and ZamMove revenue.</p>${btn('csv','Download CSV','','o')}${tbl(['Date','Booking','Driver','Stage','Method','Amount','Reference'],S.pay.filter(p=>p.by).map(p=>[ts(p.t).slice(0,10),esc(p.bid),esc(nm(p.by)),esc(p.kind),esc(p.method),peso(p.amount),esc(p.ref)]))}`;
P.sum=()=>{const ds=[...new Set(S.bk.filter(b=>b.drvUser&&gross(b)).map(b=>b.drvUser))];return `<h1>Driver settlements</h1><p class="mu">Remittance rate: ${rate()||'not configured'}%. Due = collected x rate. Outstanding = due minus verified or resolved remittances.</p>${tbl(['Driver','Collected','Due to ZamMove','Received','Outstanding'],ds.map(d=>{const g=S.bk.filter(b=>b.drvUser==d).reduce((s,b)=>s+gross(b),0),rc=S.rem.filter(r=>r.drv==d&&['Verified','Resolved'].includes(r.st)).reduce((s,r)=>s+r.recv,0);return [esc(nm(d)),peso(g),peso(due(g)),peso(rc),peso(due(g)-rc)]}))}`};
P.set=()=>`<h1>Settings</h1><div class="card"><b>Remittance rate</b><p class="mu">Share of money collected by drivers that is remitted to ZamMove each week. The requirements state 80% company / 20% driver. Confirm whether this applies to gross fare before relying on it.</p><div class="row"><input id="rate" type="number" min="1" max="100" value="${rate()||''}" style="max-width:120px">${btn('cfg','Save')}</div></div>`;
P.staff=()=>{const l=S.users.filter(u=>u.adm||u.cash),lbl=u=>[u.adm=='super'?'Owner':u.adm=='admin'?'Admin':u.adm=='sub'?'Secondary admin':'',u.cash?'Cashier':''].filter(Boolean).join(' + ');return `<h1>Staff and administrators</h1><div class="card"><div class="row"><input id="se" type="email" placeholder="Email of a registered account"><select id="sr"><option value="admin">Administrator</option><option value="sub">Secondary admin (bookings and incidents only)</option><option value="cash">Cashier</option></select>${btn('stf','Appoint')}</div></div>${tbl(['Name','Email','Role',''],l.map(u=>[esc(u.name),esc(u.em),lbl(u),u.adm=='super'?'':(u.adm?btn('unstf','Revoke admin',`data-e="${esc(u.em)}" data-k="adm"`,'o'):'')+' '+(u.cash?btn('unstf','Revoke cashier',`data-e="${esc(u.em)}" data-k="cash"`,'o'):'')]))}`};
P.log=()=>`<h1>Audit log</h1>${tbl(['Time','Actor','Event','Details'],S.au.slice(-200).reverse().map(a=>[ts(a.t),esc(a.who),esc(a.evt),`<span class="mu">${esc(JSON.stringify(a.data||{})).slice(0,120)}</span>`]))}`;

/* ---------- shell ---------- */
const loginView=m=>`<div class="login"><h1>ZamMove Admin Panel</h1><p class="mu">For administrators, secondary admins and cashiers. Sign in with your staff account.</p>${m?`<div class="fl e">${esc(m)}</div>`:''}<label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password">${btn('login','Sign in')}<p class="mu" style="margin-top:14px">The owner account is created once in the main ZamMove app (#owner-setup). Staff are appointed from Staff.</p></div>`;
let lmsg='';
const render=()=>{load();const a=$('#app');if(!me||!cu()||!(lv()||isC())){me=null;sessionStorage.removeItem(SK);a.innerHTML=loginView(lmsg);return}
 const pg=PAGES.filter(allow);if(!pg.find(p=>p[0]==page))page=pg[0][0];
 a.innerHTML=`<div class="lay"><nav class="side"><b class="brand">ZamMove Admin</b>${pg.map(p=>`<button class="${p[0]==page?'on':''}" data-a="nav" data-p="${p[0]}">${p[1]}</button>`).join('')}</nav><main class="main"><div class="top"><span class="mu">${esc(cu().name)} · ${lv()=='super'?'Owner admin':lv()=='admin'?'Administrator':lv()=='sub'?'Secondary admin':'Cashier'}${lv()&&isC()?' + Cashier':''}</span>${btn('out','Sign out','','o')}</div>${flash?`<div class="fl ${flash.e?'e':''}">${esc(flash.t)}</div>`:''}${P[page]()}</main></div>`};
const showDoc=(k,id,j)=>{load();let f='';if(k=='app')f=((S.apps.find(x=>x.id==id)||{}).docs||[])[j]?.file;else if(k=='veh')f=((vOf(id)||{}).docs||[])[j]?.file;else f=(vOf(id)||{}).photo;
 const m=$('#mod');m.innerHTML=typeof f=='string'&&/^data:image\/(jpeg|png|webp|gif);base64,/.test(f)?`<img alt="Document" src="${f}">`:'<div class="card">No preview available for this file.</div>';m.hidden=false};
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('#mod').hidden=true});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id,x=t.dataset.x;let r;
 if(a=='close'){if(e.target.id=='mod')$('#mod').hidden=true;return}
 if(a=='login'){const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value;load();const L=JSON.parse(sessionStorage.getItem(LK)||'{}'),l=L[em]||{n:0,until:0};
  if(Date.now()<l.until){lmsg='Too many attempts. Try again in a few minutes.';return render()}
  const h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw)))].map(b=>b.toString(16).padStart(2,'0')).join(''),u=U(em);
  if(u&&u.pw===h&&(u.adm||u.cash)){delete L[em];sessionStorage.setItem(LK,JSON.stringify(L));me=em;sessionStorage.setItem(SK,em);page='dash';flash=null;lmsg='';return render()}
  l.n++;if(l.n>=5){l.until=Date.now()+300000;l.n=0}L[em]=l;sessionStorage.setItem(LK,JSON.stringify(L));lmsg='Incorrect email or password, or this account has no staff access.';return render()}
 if(!me)return;
 if(a=='nav'){page=t.dataset.p;flash=null;return render()}
 if(a=='out'){me=null;sessionStorage.removeItem(SK);return render()}
 if(a=='doc')return showDoc(t.dataset.k,id,+t.dataset.j);
 if(a=='csv'){load();if(!(full()||isC()))return;const q=v=>'"'+String(v).replace(/^[=+\-@]/,"'$&").replace(/"/g,'""')+'"',rows=[['Date','Booking','Driver','Stage','Method','Amount','Reference'],...S.pay.filter(p=>p.by).map(p=>[ts(p.t).slice(0,10),p.bid,p.by,p.kind,p.method,p.amount,p.ref])],l=document.createElement('a');l.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));l.download='zammove-ledger.csv';l.click();return}
 load();
 if(a=='app')r=A.app(id,x,{note:val(id,'n'),reason:val(id,'r'),when:val(id,'w'),where:val(id,'p')});
 else if(a=='veh')r=A.veh(id,x,val(id,'r'));else if(a=='asg')r=A.asg(id,x,val(id,'r'));
 else if(a=='ver')r=A.verify(id,val(id,'a'),val(id,'n'));else if(a=='res')r=A.resolve(id,val(id,'n'),val(id,'a'));
 else if(a=='inc')r=A.inc(id,x,val(id,'n'));else if(a=='cfg')r=A.cfg($('#rate').value);
 else if(a=='stf')r=A.staff($('#se').value,$('#sr').value);else if(a=='unstf')r=A.unstaff(t.dataset.e,t.dataset.k);
 if(r){if(r.ok){save();flash={t:r.msg||'Done.'}}else flash={t:r.err,e:1};render()}});
window.addEventListener('storage',e=>{if(e.key==KEY&&me)render()});
render();
</script></body></html>
