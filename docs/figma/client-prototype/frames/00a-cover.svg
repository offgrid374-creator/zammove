<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080"><title>00 ZamMove client prototype</title><rect width="1920" height="1080" fill="#0F172A"/><circle cx="1640" cy="160" r="420" fill="#0F766E" opacity="0.35"/><circle cx="1800" cy="900" r="300" fill="#3FB8AF" opacity="0.18"/><text x="140.0" y="300.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="132" font-weight="800" fill="#FFFFFF" text-anchor="start" letter-spacing="-3">ZamMove</text><text x="146.0" y="380.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="500" fill="#C7F2EC" text-anchor="start">Booking, tracking and payment settlement for moving and goods transport</text><text x="146.0" y="428.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="500" fill="#C7F2EC" text-anchor="start">in Zamboanga City, plus self-drive vehicle rental</text><text x="146.0" y="540.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#3FB8AF" text-anchor="start" letter-spacing="3">CLIENT PROTOTYPE</text><text x="146.0" y="590.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="400" fill="#CBD5E1" text-anchor="start">A walk-through of every screen of the working system, captured with realistic</text><text x="146.0" y="626.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="400" fill="#CBD5E1" text-anchor="start">example data. Numbered markers on each screen are explained in plain language</text><text x="146.0" y="662.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="400" fill="#CBD5E1" text-anchor="start">on the right. Use the buttons to move between screens.</text><rect x="146.0" y="790.0" width="310.0" height="150.0" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5"/><rect x="146" y="790" width="8" height="150" rx="4" fill="#D5F2EE"/><text x="176.0" y="838.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="start">Customer</text><text x="176.0" y="872.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">Books hauls, rents</text><text x="176.0" y="896.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">vehicles, tracks trips,</text><text x="176.0" y="921.3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">pays</text><rect x="476.0" y="790.0" width="310.0" height="150.0" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5"/><rect x="476" y="790" width="8" height="150" rx="4" fill="#DBE6FE"/><text x="506.0" y="838.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="start">Driver</text><text x="506.0" y="872.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">Accepts jobs, runs the</text><text x="506.0" y="896.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">trip, collects payment</text><rect x="806.0" y="790.0" width="310.0" height="150.0" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5"/><rect x="806" y="790" width="8" height="150" rx="4" fill="#EAE2FD"/><text x="836.0" y="838.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="start">Vehicle owner</text><text x="836.0" y="872.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">Registers vehicles,</text><text x="836.0" y="896.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">assigns drivers, rents out</text><rect x="1136.0" y="790.0" width="310.0" height="150.0" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5"/><rect x="1136" y="790" width="8" height="150" rx="4" fill="#FCEBCF"/><text x="1166.0" y="838.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="start">Cashier</text><text x="1166.0" y="872.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">Verifies payments and</text><text x="1166.0" y="896.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">weekly remittances</text><rect x="1466.0" y="790.0" width="310.0" height="150.0" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5"/><rect x="1466" y="790" width="8" height="150" rx="4" fill="#FBE0E0"/><text x="1496.0" y="838.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="start">Administrator</text><text x="1496.0" y="872.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">Approves people and</text><text x="1496.0" y="896.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">vehicles, oversees</text><text x="1496.0" y="921.3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start">everything</text><g id="Go_to_00b-how-it-works"><rect x="146.0" y="980.0" width="300.0" height="46.0" rx="23" fill="#0F766E" stroke="#0F766E" stroke-width="0"/><text x="168.0" y="1009.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="start">Start: how ZamMove works</text><text x="424.0" y="1009.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="end">→</text></g><g id="Go_to_00c-index"><rect x="466.0" y="980.0" width="190.0" height="46.0" rx="23" fill="#334155" stroke="#334155" stroke-width="0"/><text x="488.0" y="1009.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="start">Screen index</text><text x="634.0" y="1009.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="end">→</text></g></svg>