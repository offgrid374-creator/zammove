00.0" y="416.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="1.2">WHAT EACH NUMBER MEANS</text><g id="Note_1"><rect x="1300.0" y="440.0" width="560.0" height="71.2" rx="12" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1.2"/><circle cx="1328.0" cy="470.0" r="15" fill="#E8590C" stroke="#fff" stroke-width="3"/><text x="1328.0" y="475.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="1356.0" y="476.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Verify or reject</text><text x="1356.0" y="502.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Rejection needs a reason.</text></g><text x="1300.0" y="545.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="1.2">GO TO (connect these in Figma → Prototype)</text><g id="Go_to_H01-cashier-remittances"><rect x="1300.0" y="563.2" width="220.4" height="46.0" rx="23" fill="#B45309" stroke="#B45309" stroke-width="0"/><text x="1322.0" y="592.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="start">Remittances · H01</text><text x="1498.4" y="592.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="end">→</text></g><text x="1300.0" y="635.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start">Leads to: H01 Remittance queue</text><g id="Go_to_00c-index"><rect x="1300.0" y="671.5" width="190.0" height="46.0" rx="23" fill="#334155" stroke="#334155" stroke-width="0"/><text x="1322.0" y="700.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="1