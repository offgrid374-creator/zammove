nt-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="1356.0" y="527.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Reset code</text><text x="1356.0" y="553.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Expires after a short time; wrong codes are refused.</text></g><g id="Note_2"><rect x="1300.0" y="572.8" width="560.0" height="71.2" rx="12" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1.2"/><circle cx="1328.0" cy="602.8" r="15" fill="#E8590C" stroke="#fff" stroke-width="3"/><text x="1328.0" y="608.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="1356.0" y="608.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start">New password</text><text x="1356.0" y="634.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Same rules as at sign-up.</text></g><g id="Note_3"><rect x="1300.0" y="654.0" width="560.0" height="71.2" rx="12" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1.2"/><circle cx="1328.0" cy="684.0" r="15" fill="#E8590C" stroke="#fff" stroke-width="3"/><text x="1328.0" y="689.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="1356.0" y="690.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Update password</text><text x="1356.0" y="716.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Then log in with the new password.</text></g><text x="1300.0" y="759.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill=