rif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="start" letter-spacing="1.2">WHAT THIS SCREEN IS FOR</text><text x="1300.0" y="234.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" fill="#111827" text-anchor="start">Report a problem on a trip (delay, damage,</text><text x="1300.0" y="262.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" fill="#111827" text-anchor="start">missing items, driver conduct). Staff</text><text x="1300.0" y="290.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" fill="#111827" text-anchor="start">investigate each case.</text><rect x="1300.0" y="335.2" width="560.0" height="98.4" rx="14" fill="#D5F2EE" stroke="#D5F2EE" stroke-width="0"/><text x="1324.0" y="365.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#0F766E" text-anchor="start" letter-spacing="1.1">EXAMPLE DATA ON THIS SCREEN</text><text x="1324.0" y="391.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#111827" text-anchor="start">IN-4RT6YB: driver arrived 40 minutes late (Medium),</text><text x="1324.0" y="414.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#111827" text-anchor="start">under review.</text><text x="1300.0" y="467.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="start" letter-spacing="1.2">WHAT EACH NUMBER MEANS</text><g id="Note_1"><rect x="1300.0" y="491.6" width="560.0" height="71.2" rx="12" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1.2"/><circle cx="1328.0" cy="521.6" r="15" fill="#E8590C" stroke="#fff" stroke-width="3"/><text x="1328.0" y="527.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="1356.0" y="527.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Linked booking</text><text x="1356.0" y="553.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Gives staff the full context.</text></g><g id="Note_2"><rect x="1300.0" y="572.8" width="560.0" height="71.2" rx="12" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1.2"/><circle cx="1328.0" cy="602.8" r="15" fill="#E8590C" stroke="#fff" stroke-width="3"/><text x="1328.0" y="608.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="1356.0" y="608.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Category and severity</text><text x="1356.0" y="634.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">High severity alerts staff immediately.</text></g><g id="Note_3"><rect x="1300.0" y="654.0" width="560.0" height="71.2" rx="12" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1.2"/><circle cx="1328.0" cy="684.0" r="15" fill="#E8590C" stroke="#fff" stroke-width="3"/><text x="1328.0" y="689.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="1356.0" y="690.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Your reports</text><text x="1356.0" y="716.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Status of each report.</text></g><text x="1300.0" y="759.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="start" letter-spacing="1.2">GO TO (connect these in Figma → Prototype)</text><g id="Go_to_I08-admin-incidents"><rect x="1300.0" y