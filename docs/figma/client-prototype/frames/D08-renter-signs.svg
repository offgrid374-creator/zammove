size="20" font-weight="500" fill="#111827" text-anchor="start">the signature with a finger or mouse.</text><rect x="1300.0" y="335.2" width="560.0" height="75.2" rx="14" fill="#D5F2EE" stroke="#D5F2EE" stroke-width="0"/><text x="1324.0" y="365.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#0F766E" text-anchor="start" letter-spacing="1.1">EXAMPLE DATA ON THIS SCREEN</text><text x="1324.0" y="391.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#111827" text-anchor="start">Carla Mendoza signs before pickup.</text><text x="1300.0" y="444.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="start" letter-spacing="1.2">WHAT EACH NUMBER MEANS</text><g id="Note_1"><rect x="1300.0" y="468.4" width="560.0" height="71.2" rx="12" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1.2"/><circle cx="1328.0" cy="498.4" r="15" fill="#E8590C" stroke="#fff" stroke-width="3"/><text x="1328.0" y="503.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="1356.0" y="504.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Agreement</text><text x="1356.0" y="530.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Required.</text></g><g id="Note_2"><rect x="1300.0" y="549.6" width="560.0" height="71.2" rx="12" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1.2"/><circle cx="1328.0" cy="579.6" r="15" fill="#E8590C" stroke="#fff" stroke-width="3"/><text x="1328.0" y="585.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="1356.0" y="585.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Full name</text><text x="1356.0" y="611.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Must match the account name.</text></g><g id="Note_3"><rect x="1300.0" y="630.8" width="560.0" height="71.2" rx="12" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1.2"/><circle cx="1328.0" cy="660.8" r="15" fill="#E8590C" stroke="#fff" stroke-width="3"/><text x="1328.0" y="666.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="1356.0" y="666.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Signature pad</text><text x="1356.0" y="692.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Saved as an image on the contract.</text></g><g id="Note_4"><rect x="1300.0" y="712.0" width="560.0" height="71.2" rx="12" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1.2"/><circle cx="1328.0" cy="742.0" r="15" fill="#E8590C" stroke="#fff" stroke-width="3"/><text x="1328.0" y="747.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="1356.0" y="748.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Sign</text><text x="1356.0" y="774.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Records the time and the fingerprint signed.</text></g><text x="1300.0" y="817.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="start" letter-spacing="1.2">GO TO (connect these in Figma → Prototype)</text><g id="Go_to_D09-owner-signs"><rect x="1300.0" y="835.2" width="238.8" height="46.0" rx="23" fill="#0F766E" stroke="#0F766