boanga-City-Philippines" font-family="Geist" font-size="14" font-weight="400" fill="#5f6779" xml:space="preserve"><tspan x="164" y="1353.98">ZamMove, Zamboanga City, Philippines</tspan></text></g><g id="span_3"><text id="Text-Prototype-accounts-and-bookings-stay-in-th" font-family="Geist" font-size="14" font-weight="400" fill="#5f6779" xml:space="preserve"><tspan x="927.06" y="1353.98">Prototype: accounts and bookings stay in this browser.</tspan></text></g></g></g></g></g><g id="p-top"><rect x="0" y="31.19" width="1440" height="72" id="Fill_4" fill="#f5f7fa"/><g id="p-c"><g id="Link-ZamMove"><text id="Text-ZamMove" font-family="Bricolage Grotesque" font-size="22" font-weight="700" letter-spacing="-0.44" fill="#0f766e" xml:space="preserve"><tspan x="164" y="73.59">ZamMove</tspan></text></g><g id="Navigation"><g id="Link-Vehicles"><text id="Text-Vehicles" font-family="Geist" font-size="15" font-weight="700" fill="#4b5565" xml:space="preserve"><tspan x="531.97" y="72.19">Vehicles</tspan></text></g><g id="Link-How-it-works"><text id="Text-How-it-works" font-family="Geist" font-size="15" font-weight="700" fill="#4b5565" xml:space="preserve"><tspan x="615.63" y="72.19">How it works</tspan></text></g><g id="Link-Questions"><text id="Text-Questions" font-family="Geist" font-size="15" font-weight="700" fill="#4b5565" xml:space="preserve"><tspan x="730.34" y="72.19">Questions</tspan></text></g></g><g id="p-act"><g id="Link-Log-in"><text id="Text-Log-in" font-family="Geist" font-size="15" font-weight="500" fill="#111827" xml:space="preserve"><tspan x="1068.2" y="72.19">Log in</tspan></text></g><g id="Link-Create-account"><rect x="1130.64" y="45.19" width="145.36" height="44" rx="8" id="Fill_5" fill="#3fb8af"/><text id="Text-Create-account" font-family="Geist" font-size="15" font-weight="500" fill="#0b0d14" xml:space="preserve"><tspan x="1149.64" y="72.19">Create account</tspan></text></g></g></g></g></g></g><g id="Marker_1"><rect x="482.1" y="971.7" width="335.8" height="50.6