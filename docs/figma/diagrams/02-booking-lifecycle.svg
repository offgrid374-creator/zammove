<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F7FA" stroke="#F5F7FA" stroke-width="1.5"/><text x="40" y="58" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="start">Booking lifecycle</text><text x="40" y="90" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F6779" text-anchor="start">One status order shared by the customer, driver, admin screens and the server</text><rect x="40" y="170" width="214" height="86" rx="14" fill="#FFFFFF" stroke="#3FB8AF" stroke-width="2"/><text x="147.0" y="207" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Pending</text><text x="147.0" y="232" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="middle">Customer requested</text><rect x="300" y="170" width="214" height="86" rx="14" fill="#FFFFFF" stroke="#3FB8AF" stroke-width="2"/><text x="407.0" y="207" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Accepted</text><text x="407.0" y="232" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="middle">Driver assigned</text><rect x="560" y="170" width="214" height="86" rx="14" fill="#FFFFFF" stroke="#3FB8AF" stroke-width="2"/><text x="667.0" y="207" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">On the Way to Pickup</text><text x="667.0" y="232" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="middle">Tracking opens</text><rect x="820" y="170" width="214" height="86" rx="14" fill="#FFFFFF" stroke="#3FB8AF" stroke-width="2"/><text x="927.0" y="207" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Awaiting Down Payment</text><text x="927.0" y="232" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="middle">Driver at pickup</text><rect x="1080" y="170" width="214" height="86" rx="14" fill="#FFFFFF" stroke="#3FB8AF" stroke-width="2"/><text x="1187.0" y="207" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Down Payment Confirmed</text><text x="1187.0" y="232" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="middle">50% recorded</text><rect x="1340" y="170" width="214" height="86" rx="14" fill="#FFFFFF" stroke="#3FB8AF" stroke-width="2"/><text x="1447.0" y="207" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Items Loaded</text><text x="1447.0" y="232" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="middle">Pre-departure checks</text><rect x="1340" y="470" width="214" height="86" rx="14" fill="#FFFFFF" stroke="#3FB8AF" stroke-width="2"/><text x="1447.0" y="507" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">In Transit</text><text x="1447.0" y="532" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="middle">Departure authorized</text><rect x="1080" y="470" width="214" height="86" rx="14" fill="#FFFFFF" stroke="#3FB8AF" stroke-width="2"/><text x="1187.0" y="507" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Arrived at Destination</text><text x="1187.0" y="532" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="middle">Delivery PIN issued</text><rect x="820" y="470" width="214" height="86" rx="14" fill="#FFFFFF" stroke="#3FB8AF" stroke-width="2"/><text x="927.0" y="507" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Delivery Confirmation</text><text x="927.0" y="532" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="middle">Proof of delivery saved</text><rect x="560" y="470" width="214" height="86" rx="14" fill="#FFFFFF" stroke="#3FB8AF" stroke-width="2"/><text x="667.0" y="507" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Awaiting Final Payment</text><text x="667.0" y="532" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="middle">Balance due</text><rect x="300" y="470" width="214" height="86" rx="14" fill="#DCF2E3" stroke="#0F766E" stroke-width="2"/><text x="407.0" y="507" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Completed</text><text x="407.0" y="532" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="middle">Customer can rate</text><polyline points="258,213.0 296,213.0" fill="none" stroke="#0F766E" stroke-width="2.5"/><polygon points="296.0,213.0 285.0,207.0 285.0,219.0" fill="#0F766E"/><text x="277.0" y="156" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="middle">Driver accepts (7 checks)</text><polyline points="518,213.0 556,213.0" fill="none" stroke="#0F766E" stroke-width="2.5"/><polygon points="556.0,213.0 545.0,207.0 545.0,219.0" fill="#0F766E"/><text x="537.0" y="156" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="middle">Heads to pickup</text><polyline points="778,213.0 816,213.0" fill="none" stroke="#0F766E" stroke-width="2.5"/><polygon points="816.0,213.0 805.0,207.0 805.0,219.0" fill="#0F766E"/><text x="797.0" y="156" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="middle">Arrives</text><polyline points="1038,213.0 1076,213.0" fill="none" stroke="#0F766E" stroke-width="2.5"/><polygon points="1076.0,213.0 1065.0,207.0 1065.0,219.0" fill="#0F766E"/><text x="1057.0" y="156" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="middle">50% collected</text><polyline points="1298,213.0 1336,213.0" fill="none" stroke="#0F766E" stroke-width="2.5"/><polygon points="1336.0,213.0 1325.0,207.0 1325.0,219.0" fill="#0F766E"/><text x="1317.0" y="156" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="middle">Cargo loaded</text><polyline points="1447.0,260 1447.0,466" fill="none" stroke="#C2410C" stroke-width="3"/><polygon points="1447.0,466.0 1453.0,455.0 1441.0,455.0" fill="#C2410C"/><text x="1431.0" y="308.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#C2410C" text-anchor="end">Start PIN + plate + cargo</text><text x="1431.0" y="327.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#C2410C" text-anchor="end">checklist + driver and</text><text x="1431.0" y="347.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#C2410C" text-anchor="end">customer confirm</text><polyline points="1336,513.0 1298,513.0" fill="none" stroke="#0F766E" stroke-width="2.5"/><polygon points="1298.0,513.0 1309.0,519.0 1309.0,507.0" fill="#0F766E"/><text x="1317.0" y="586" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="middle">Arrives</text><polyline points="1076,513.0 1038,513.0" fill="none" stroke="#C2410C" stroke-width="2.5"/><polygon points="1038.0,513.0 1049.0,519.0 1049.0,507.0" fill="#C2410C"/><text x="1057.0" y="586" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#C2410C" text-anchor="middle">Delivery PIN + note</text><polyline points="816,513.0 778,513.0" fill="none" stroke="#0F766E" stroke-width="2.5"/><polygon points="778.0,513.0 789.0,519.0 789.0,507.0" fill="#0F766E"/><text x="797.0" y="586" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="middle">Requests balance</text><polyline points="556,513.0 518,513.0" fill="none" stroke="#0F766E" stroke-width="2.5"/><polygon points="518.0,513.0 529.0,519.0 529.0,507.0" fill="#0F766E"/><text x="537.0" y="586" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="middle">50% collected</text><rect x="40" y="320" width="214" height="86" rx="14" fill="#FDEBDD" stroke="#C2410C" stroke-width="2"/><text x="147.0" y="357" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">No driver found</text><text x="147.0" y="382" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="middle">Not accepted in time</text><polyline points="80,260 80,316" fill="none" stroke="#C2410C" stroke-width="2"/><polygon points="80.0,316.0 86.0,305.0 74.0,305.0" fill="#C2410C"/><polyline points="210,316 210,260" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="7 6"/><polygon points="210.0,260.0 204.0,271.0 216.0,271.0" fill="#0F766E"/><text x="88" y="294" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#C2410C" text-anchor="start">After 30 min</text><text x="218" y="276.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="start">Re-submit or</text><text x="218" y="292.25" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="start">admin</text><text x="218" y="308.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="start">assigns</text><rect x="40" y="640" width="214" height="86" rx="14" fill="#F3F4F6" stroke="#9AA3B4" stroke-width="2"/><text x="147.0" y="677" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Cancelled</text><text x="147.0" y="702" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="middle">By the customer</text><polyline points="150,410 150,636" fill="none" stroke="#9AA3B4" stroke-width="2" stroke-dasharray="7 6"/><polygon points="150.0,636.0 156.0,625.0 144.0,625.0" fill="#9AA3B4"/><rect x="300" y="640" width="600" height="153.4000000000001" rx="12" fill="#FFFFFF" stroke="#D5DAE3" stroke-width="1.5"/><text x="320" y="677" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="start">Cancellation</text><text x="320" y="705.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">Allowed from Pending, No driver found, Accepted, On the Way to Pickup and</text><text x="320" y="724.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">Awaiting Down Payment.</text><text x="320" y="748.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">Free before a driver accepts; 10% fee afterwards (recorded as a payment</text><text x="320" y="767.8000000000001" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">for a cashier to verify).</text><rect x="930" y="640" width="630" height="153.4000000000001" rx="12" fill="#DDF3F1" stroke="#3FB8AF" stroke-width="1.5"/><text x="950" y="677" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="start">Rules enforced by the server</text><text x="950" y="705.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">PINs: 6 digits, expire in 30 min, 5 wrong tries lock for 5 min; the admin can</text><text x="950" y="724.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">waive with a reason.</text><text x="950" y="748.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">Payments: a customer GCash proof counts only when the driver records it; each</text><text x="950" y="767.8000000000001" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">payment counted once.</text></svg>
