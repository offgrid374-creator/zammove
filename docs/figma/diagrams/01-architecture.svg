<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="930" viewBox="0 0 1600 930"><rect x="0" y="0" width="1600" height="930" rx="0" fill="#F5F7FA" stroke="#F5F7FA" stroke-width="1.5"/><text x="40" y="58" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="start">System architecture</text><text x="40" y="90" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F6779" text-anchor="start">Three tiers: browser screens → Node.js API that holds every business rule → Supabase Postgres</text><rect x="40" y="120" width="470" height="640" rx="16" fill="#EEF2F6" stroke="#D5DAE3" stroke-width="1.5"/><text x="64" y="156" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="start">Frontend (browser)</text><text x="64" y="180" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">frontend/  ·  HTML, CSS, JavaScript</text><rect x="64" y="200" width="422" height="156" rx="12" fill="#FFFFFF" stroke="#D5DAE3" stroke-width="1.5"/><text x="84" y="230" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="start">Customer web app</text><text x="84" y="256" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">frontend/customer · one app with a workspace per role:</text><rect x="84" y="272" width="84" height="28" rx="14" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="1.5"/><text x="126.0" y="291" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F766E" text-anchor="middle">Customer</text><rect x="176" y="272" width="69" height="28" rx="14" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="1.5"/><text x="210.5" y="291" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F766E" text-anchor="middle">Driver</text><rect x="253" y="272" width="122" height="28" rx="14" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="1.5"/><text x="314.0" y="291" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F766E" text-anchor="middle">Vehicle owner</text><rect x="84" y="310" width="76" height="28" rx="14" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="1.5"/><text x="122.0" y="329" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F766E" text-anchor="middle">Cashier</text><rect x="168" y="310" width="122" height="28" rx="14" fill="#DDF3F1" stroke="#DDF3F1" stroke-width="1.5"/><text x="229.0" y="329" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F766E" text-anchor="middle">Admin console</text><rect x="64" y="372" width="422" height="90.60000000000002" rx="12" fill="#FFFFFF" stroke="#D5DAE3" stroke-width="1.5"/><text x="84" y="409" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="start">Admin Panel</text><text x="84" y="437.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">frontend/admin · separate staff console</text><rect x="64" y="478.6" width="422" height="137.80000000000007" rx="12" fill="#DDF3F1" stroke="#3FB8AF" stroke-width="1.5"/><text x="84" y="515.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="start">shared/api.js</text><text x="84" y="543.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">Keeps the login token per browser tab</text><text x="84" y="567.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">Sends actions, receives the user’s view</text><text x="84" y="590.8000000000001" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">Stores no business data in the browser</text><rect x="590" y="120" width="520" height="640" rx="16" fill="#EEF2F6" stroke="#D5DAE3" stroke-width="1.5"/><text x="614" y="156" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="start">Backend (Node.js + Express)</text><text x="614" y="180" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">backend/  ·  JavaScript</text><rect x="614" y="200" width="472" height="80.19999999999999" rx="12" fill="#FFFFFF" stroke="#D5DAE3" stroke-width="1.5"/><text x="630" y="232" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">app.js · routes</text><text x="630" y="259.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="start">Checks the signed login token on every request</text><rect x="614" y="296.2" width="472" height="138.79999999999995" rx="12" fill="#DDF3F1" stroke="#3FB8AF" stroke-width="1.5"/><text x="630" y="328.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">domain/ · business rules</text><text x="630" y="355.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="start">auth · bookings · verification · rentals · workspace · finance</text><text x="630" y="373.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="start">· helpers</text><text x="630" y="395.59999999999997" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="start">Pricing, capacity, driver eligibility, payments, PINs,</text><text x="630" y="413.79999999999995" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="start">remittances</text><polyline points="850,282.2 850,294.2" fill="none" stroke="#0F766E" stroke-width="2"/><polygon points="850.0,294.2 856.0,283.2 844.0,283.2" fill="#0F766E"/><rect x="614" y="450.99999999999994" width="472" height="80.19999999999999" rx="12" fill="#FFFFFF" stroke="#D5DAE3" stroke-width="1.5"/><text x="630" y="482.99999999999994" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">views.js · role-scoped data</text><text x="630" y="509.99999999999994" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="start">Each user receives only what their role may see</text><polyline points="850,436.99999999999994 850,448.99999999999994" fill="none" stroke="#0F766E" stroke-width="2"/><polygon points="850.0,449.0 856.0,438.0 844.0,438.0" fill="#0F766E"/><rect x="614" y="547.1999999999999" width="472" height="98.39999999999998" rx="12" fill="#FFFFFF" stroke="#D5DAE3" stroke-width="1.5"/><text x="630" y="579.1999999999999" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">state.js · safe writes</text><text x="630" y="606.1999999999999" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="start">One action at a time · only changed rows saved · rollback on</text><text x="630" y="624.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="start">error</text><polyline points="850,533.1999999999999 850,545.1999999999999" fill="none" stroke="#0F766E" stroke-width="2"/><polygon points="850.0,545.2 856.0,534.2 844.0,534.2" fill="#0F766E"/><rect x="614" y="661.5999999999999" width="472" height="80.20000000000005" rx="12" fill="#FFFFFF" stroke="#D5DAE3" stroke-width="1.5"/><text x="630" y="693.5999999999999" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">store/ · storage adapter</text><text x="630" y="720.5999999999999" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6779" text-anchor="start">Supabase · local JSON file · memory (tests)</text><polyline points="850,647.5999999999999 850,659.5999999999999" fill="none" stroke="#0F766E" stroke-width="2"/><polygon points="850.0,659.6 856.0,648.6 844.0,648.6" fill="#0F766E"/><rect x="1190" y="120" width="370" height="640" rx="16" fill="#EEF2F6" stroke="#D5DAE3" stroke-width="1.5"/><text x="1214" y="156" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="start">Database</text><text x="1214" y="180" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">backend/sql/schema.sql</text><rect x="1214" y="200" width="322" height="153.39999999999998" rx="12" fill="#DDF3F1" stroke="#3FB8AF" stroke-width="1.5"/><text x="1234" y="237" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="start">Supabase Postgres</text><text x="1234" y="265.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">14 tables · full record in JSONB plus</text><text x="1234" y="284.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">indexed columns</text><text x="1234" y="308.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">Row Level Security on: public keys</text><text x="1234" y="327.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">can read nothing</text><rect x="1214" y="369.4" width="322" height="110.19999999999999" rx="12" fill="#FFFFFF" stroke="#D5DAE3" stroke-width="1.5"/><text x="1234" y="406.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="start">Local JSON file</text><text x="1234" y="434.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">backend/.data · development without</text><text x="1234" y="454.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">Supabase</text><rect x="1214" y="495.59999999999997" width="322" height="90.59999999999997" rx="12" fill="#FFFFFF" stroke="#D5DAE3" stroke-width="1.5"/><text x="1234" y="532.5999999999999" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="start">Memory</text><text x="1234" y="560.5999999999999" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6779" text-anchor="start">Automated tests</text><polyline points="510,430 590,430" fill="none" stroke="#0F766E" stroke-width="3"/><polygon points="590.0,430.0 579.0,424.0 579.0,436.0" fill="#0F766E"/><polygon points="510.0,430.0 521.0,436.0 521.0,424.0" fill="#0F766E"/><text x="550" y="412" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="middle">HTTPS + JSON</text><text x="550" y="462.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6779" text-anchor="middle">/api/auth</text><text x="550" y="477.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6779" text-anchor="middle">·</text><text x="550" y="493.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6779" text-anchor="middle">/api/act/:action</text><text x="550" y="508.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6779" text-anchor="middle">·</text><text x="550" y="524.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6779" text-anchor="middle">/api/state</text><polyline points="1110,300 1190,300" fill="none" stroke="#0F766E" stroke-width="3"/><polygon points="1190.0,300.0 1179.0,294.0 1179.0,306.0" fill="#0F766E"/><polygon points="1110.0,300.0 1121.0,306.0 1121.0,294.0" fill="#0F766E"/><text x="1150" y="330.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6779" text-anchor="middle">service-role</text><text x="1150" y="345.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6779" text-anchor="middle">key (server</text><text x="1150" y="361.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6779" text-anchor="middle">only)</text><rect x="40" y="790" width="1520" height="110" rx="14" fill="#FFFFFF" stroke="#9AA3B4" stroke-width="1.5" stroke-dasharray="8 6"/><text x="64" y="826" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="start">Not connected yet (future integrations)</text><rect x="64" y="846" width="218" height="28" rx="14" fill="#FDEBDD" stroke="#FDEBDD" stroke-width="1.5"/><text x="173.0" y="865" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#C2410C" text-anchor="middle">GCash / PayMongo gateway</text><rect x="294" y="846" width="356" height="28" rx="14" fill="#FDEBDD" stroke="#FDEBDD" stroke-width="1.5"/><text x="472.0" y="865" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#C2410C" text-anchor="middle">SMS &amp; email (codes shown on screen today)</text><rect x="662" y="846" width="210" height="28" rx="14" fill="#FDEBDD" stroke="#FDEBDD" stroke-width="1.5"/><text x="767.0" y="865" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#C2410C" text-anchor="middle">Maps routing &amp; live GPS</text><rect x="884" y="846" width="283" height="28" rx="14" fill="#FDEBDD" stroke="#FDEBDD" stroke-width="1.5"/><text x="1025.5" y="865" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#C2410C" text-anchor="middle">Photo storage (Supabase Storage)</text></svg>
